<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="Choose a topic. Make it your own. Maths practice, exams, workbooks and worked solutions from See Maths.">
  <meta property="og:title" content="See Maths">
  <meta property="og:url" content="https://seemaths.org/">
  <link rel="icon" href="/favicon.svg?v=division" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=builder-stepper-2">
  <link rel="stylesheet" href="/runtime/page-layout.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=division">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="See Maths">
  <script src="/pwa.js" defer></script>
  <title>See Maths</title>
  <link rel="stylesheet" href="/assignment-library.css?v=1">
  <script src="/assignment-library.js?v=2" defer></script>
  <script src="/script.js?v=builder-stepper-1" defer></script>
  <link rel="stylesheet" href="/seemaths-brand.css?v=1">
</head>
<body>
  <a class="skip-link" href="#activity">Skip to activity builder</a>
  <div class="math-margins" aria-hidden="true"><div class="math-margin math-margin-left"></div><div class="math-margin math-margin-right"></div></div>
  <main id="activity" class="builder">
    <header class="masthead">
      <a class="brand seemaths-brand" href="/" aria-label="See Maths home">
        <svg class="brand-mark" viewBox="220 140 420 320" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">  <g transform="rotate(-12 430 300)">
    <path d="M260 200 Q340 160 420 200" fill="none" stroke="#5E667A" stroke-width="14" stroke-linecap="round"/>
    <path d="M440 200 Q520 160 600 200" fill="none" stroke="#5E667A" stroke-width="14" stroke-linecap="round"/>
    <ellipse cx="360" cy="320" rx="90" ry="110" fill="#FFFFFF" stroke="#1b2b4b" stroke-width="10"/>
    <ellipse cx="390" cy="350" rx="42" ry="50" fill="#3DB5F2"/>
    <circle cx="405" cy="360" r="26" fill="#000000"/>
    <circle cx="390" cy="330" r="10" fill="#FFFFFF"/>
    <ellipse cx="520" cy="320" rx="78" ry="96" fill="#FFFFFF" stroke="#1b2b4b" stroke-width="10"/>
    <ellipse cx="545" cy="350" rx="36" ry="44" fill="#3DB5F2"/>
    <circle cx="558" cy="358" r="22" fill="#000000"/>
    <circle cx="545" cy="332" r="8" fill="#FFFFFF"/>
  </g></svg>
        <span>See Maths</span>
      </a>
      <nav class="player-links" aria-label="Maths players">
        <a class="player-link player-link-naplan" href="/naplan-player/" data-local-player="/naplan-player/">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-5 9 5-9 5Z M6 11v6c4 3 8 3 12 0v-6 M21 9v8"/></svg><span>NAPLAN</span>
        </a>
        <a class="player-link player-link-psat" href="/psat-player/" data-local-player="/psat-player/">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5Z M9 4V2h6v2 M9 10l2 2 4-4 M9 16h6"/></svg><span>PSAT</span>
        </a>
      </nav>
    </header>

    <form id="activity-form" novalidate>
      <fieldset class="step topic-step">
        <legend class="visually-hidden">Topic</legend>
        <div class="chips topics" aria-label="Topic">
          <button type="button" class="chip topic-tile" data-topic="algebra" aria-pressed="false"><span class="topic-symbol" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="m12 15 16 20M28 15 12 35M32 12h10M37 7v10"/><path class="icon-soft" d="M7 42h34"/></svg></span><span class="topic-name">Algebra</span></button>
          <button type="button" class="chip topic-tile" data-topic="arithmetic" aria-pressed="false"><span class="topic-symbol" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M8 13h13M14.5 6.5v13M29 12h12M9 31l11 11M20 31 9 42M29 36h13"/><circle cx="35.5" cy="28" r="1.4"/><circle cx="35.5" cy="44" r="1.4"/></svg></span><span class="topic-name">Arithmetic</span></button>
          <button type="button" class="chip topic-tile" data-topic="geometry" aria-pressed="false"><span class="topic-symbol" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="m7 39 17-30 17 30Z"/><path class="icon-soft" d="M7 39h34M24 9v30M20 39v-4h4"/><path d="M31 29a10 10 0 0 0-7-3"/></svg></span><span class="topic-name">Geometry</span></button>
          <button type="button" class="chip topic-tile" data-topic="measurement" aria-pressed="false"><span class="topic-symbol" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="m8 31 23-23 10 10-23 23Z"/><path d="m15 24 4 4M22 17l4 4M29 10l4 4M22 38l-4-4M29 31l-4-4M36 24l-4-4"/></svg></span><span class="topic-name">Measurement</span></button>
          <button type="button" class="chip topic-tile" data-topic="number" aria-pressed="false"><span class="topic-symbol" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M6 34h36M10 29v10M24 29v10M38 29v10M9 12l4-3v13M22 12c0-5 9-5 9 0 0 4-9 5-9 10h9"/><path class="icon-soft" d="m37 30 5 4-5 4"/></svg></span><span class="topic-name">Number</span></button>
          <button type="button" class="chip topic-tile" data-topic="statistics" aria-pressed="false"><span class="topic-symbol" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M7 7v34h35"/><path d="M14 32v-9h6v9M25 32V17h6v15M36 32V10h6v22"/><path class="icon-soft" d="m12 15 11-7 8 3 11-8"/></svg></span><span class="topic-name">Statistics</span></button>
          <button type="button" class="chip topic-tile random-chip" data-topic="random" aria-pressed="false"><span class="topic-symbol" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M8 14h6c10 0 10 20 20 20h7M35 28l6 6-6 6M8 34h6c4 0 6-3 8-7M26 20c2-4 4-6 8-6h7M35 8l6 6-6 6"/></svg></span><span class="topic-name">Mixed</span></button>
        </div>
      </fieldset>

      <nav class="builder-stepper" aria-label="Question-set progress">
        <ol>
          <li data-builder-step="0" aria-current="step"><span class="stepper-icon" aria-hidden="true">1</span><span>Choose a topic</span></li>
          <li data-builder-step="1"><span class="stepper-icon" aria-hidden="true">2</span><span>Choose a type</span></li>
          <li data-builder-step="2"><span class="stepper-icon" aria-hidden="true">3</span><span>Design question-set</span></li>
          <li data-builder-step="3"><span class="stepper-icon" aria-hidden="true">4</span><span>Self-study or Create Exercise</span></li>
        </ol>
        <span id="stepper-status" class="visually-hidden" role="status" aria-live="polite">Step 1 of 4: Choose a topic</span>
      </nav>

      <fieldset class="step" id="mode-step" hidden>
        <legend class="visually-hidden">Activity</legend>
        <div class="chips modes" aria-label="Activity mode">
          <button type="button" class="chip" data-mode="practice" aria-pressed="false"><span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m4 17-1 4 4-1L20 7l-3-3Z"/><path d="m14 7 3 3M4 17l3 3"/></svg></span>Practice</button>
          <button type="button" class="chip" data-mode="exam" aria-pressed="false"><span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v5l3 2M9 2h6M12 2v3M18 5l2-2"/></svg></span>Exam</button>
          <button type="button" class="chip" data-mode="workbook" aria-pressed="false"><span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 3h13a2 2 0 0 1 2 2v16H5a2 2 0 0 1-2-2V4a1 1 0 0 1 1-1ZM7 3v18M10 8h6M10 12h6M10 16h4"/></svg></span>Workbook</button>
          <button type="button" class="chip" data-mode="solutions" aria-pressed="false"><span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 17h8M9 21h6M8 14a7 7 0 1 1 8 0v3H8Z"/><path d="m9 9 2 2 4-4"/></svg></span>Solutions</button>
        </div>
      </fieldset>

      <div class="activity-controls">
      <button id="close-activity-panel" class="close-activity-panel" type="button" aria-label="Close exercise panel" title="Close panel"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
      <section class="step preferences" id="settings-step" aria-labelledby="settings-title" hidden>
        <h2 id="settings-title" class="visually-hidden">Settings</h2>
        <div class="settings-grid">
          <div class="setting question-setting">
            <label for="count-range">Questions <output id="count-value" for="count-range">20 questions</output></label>
            <input id="question-count" name="count" type="hidden" min="1" max="99" value="20">
            <input id="count-range" class="range" aria-label="Number of questions" type="range" min="1" max="99" value="20">
            <div class="range-labels" aria-hidden="true"><span>1</span><span>99</span></div>
          </div>
          <fieldset class="setting difficulty-setting">
            <legend>Difficulty <output id="difficulty-value" for="level-min level-max">1–5</output></legend>
            <div class="difficulty-slider">
              <input id="level-min" class="range" name="levelMin" type="range" min="1" max="5" value="1" aria-label="Minimum difficulty">
              <input id="level-max" class="range" name="levelMax" type="range" min="1" max="5" value="5" aria-label="Maximum difficulty">
            </div>
            <div class="range-labels" aria-hidden="true"><span>1</span><span>5</span></div>
          </fieldset>
        </div>
        <div class="exercise-bottom-row">
        <fieldset class="player-setting" id="player-setting">
          <legend class="visually-hidden">Player</legend>
          <label><input type="radio" name="player" value="standard" checked><span>Standard</span></label>
          <label><input type="radio" name="player" value="arcade"><span>Arcade</span></label>
        </fieldset>
        <section class="exercise-share" id="exercise-share" aria-label="Share exercise" aria-hidden="true" inert>
          <a id="exercise-share-url" class="exercise-share-url" target="_blank" rel="noopener"></a>
          <div class="exercise-share-actions">
            <button type="button" id="share-copy" aria-label="Copy link" title="Copy link"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h4"/></svg></button>
            <button type="button" hidden id="share-native" aria-label="Share" title="Share"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m-4 4 4-4 4 4M8 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-3"/></svg></button>
            <a target="_blank" rel="noopener noreferrer" id="share-whatsapp" aria-label="Share on WhatsApp" title="Share on WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.7a8.6 8.6 0 0 1-12.8 7.5L3 20.5l1.3-4.6a8.6 8.6 0 1 1 16.2-4.2Z"/><path d="m8.3 7.3 1.5 2.4-1 1.1a8 8 0 0 0 4.2 4l1-1.1 2.5 1.3c-.4 1.8-1.7 2.2-3.2 1.6-3.9-1.5-6.4-4.4-6.8-7.1-.2-1 .5-2 1.8-2.2Z"/></svg></a>
            <a id="share-email" aria-label="Share by email" title="Share by email"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></a>
            <a target="_blank" rel="noopener noreferrer" id="share-gmail" aria-label="Share with Gmail" title="Share with Gmail"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6l8 6 8-6v13" stroke="#4285f4" stroke-width="3"/><path d="m4 6 8 6 8-6" stroke="#ea4335" stroke-width="3"/><path d="M4 12V6l3 2.3" stroke="#c5221f" stroke-width="3"/><path d="M20 12V6l-3 2.3" stroke="#fbbc04" stroke-width="3"/><path d="M20 12v7" stroke="#34a853" stroke-width="3"/></svg></a>
            <a target="_blank" rel="noopener noreferrer" id="share-facebook" aria-label="Share on Facebook" title="Share on Facebook"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="currentColor"><path d="M14 22v-9h3l.5-3.5H14V7.3c0-1 .3-1.7 1.8-1.7h1.9V2.5a24 24 0 0 0-2.8-.2C12.1 2.3 10 4 10 7v2.5H7V13h3v9Z"/></svg></a>
            <a target="_blank" rel="noopener noreferrer" id="share-linkedin" aria-label="Share on LinkedIn" title="Share on LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="currentColor"><path d="M5.5 8.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM4 10h3v10H4Zm5.5 0h3v1.4c.5-.9 1.5-1.6 3-1.6 3.1 0 3.5 2 3.5 4.6V20h-3v-5c0-1.2 0-2.7-1.7-2.7s-1.8 1.3-1.8 2.6V20h-3Z"/></svg></a>
          </div>
          <span id="share-feedback" class="visually-hidden" role="status" aria-live="polite"></span>
        </section>
        </div>
        <fieldset class="duration-setting" id="duration-setting" hidden>
          <legend>Time</legend>
          <div class="duration-row">
            <div class="number-control duration-control"><label class="visually-hidden" for="exam-minutes">Exam duration in minutes</label><input id="exam-minutes" name="minutes" type="number" min="1" max="180" value="30" inputmode="numeric"><span>minutes</span></div>
            <div class="duration-presets" aria-label="Exam duration presets">
              <button type="button" data-minutes="5" aria-pressed="false">5 min</button>
              <button type="button" data-minutes="15" aria-pressed="false">15 min</button>
              <button type="button" data-minutes="30" aria-pressed="true">30 min</button>
              <button type="button" data-minutes="60" aria-pressed="false">60 min</button>
              <button type="button" data-minutes="120" aria-pressed="false">2 hours</button>
              <button type="button" data-minutes="180" aria-pressed="false">3 hours</button>
            </div>
          </div>
        </fieldset>
      </section>

      <section class="finish" id="finish-step" aria-label="Your activity link" hidden>
        <p id="activity-summary" class="visually-hidden" aria-live="polite"></p>
        <div class="actions">
          <button class="primary-button" id="open-activity" type="submit"><span id="open-activity-label">Self Study</span></button>
          <button class="copy-button" id="copy-link" type="button"><span id="copy-link-label">Create Exercise</span><span id="copy-feedback" class="copy-feedback" role="status" aria-live="polite" hidden>Copied</span></button>
        </div>
        <label class="visually-hidden" for="activity-link">Shareable activity link</label>
        <input id="activity-link" class="activity-link" type="text" readonly hidden spellcheck="false" aria-describedby="share-note">
        <p id="share-note" class="visually-hidden">Fresh questions for each person.</p>
        <p id="status" class="status" aria-live="polite" role="status"></p>
      </section>
      </div>
    </form>
    <noscript><p class="noscript">Please enable JavaScript to prepare your activity.</p></noscript>
  </main>
</body>
</html>
