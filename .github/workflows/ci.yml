name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  website:
    name: Website and bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Browser engine sources are a separate private checkout; the complete
      # runtime export is validated locally before publishing.
      - run: npm run build -- --site-only

  portal:
    name: Assignment API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignments-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: assignments-portal/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
